<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How It Works</title>
  <meta name="description" content="Animated, step-by-step explainers of how the internet and software systems actually work.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/base.css">
  <style>
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header.site {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; }
    .brand img { width: 28px; height: 28px; }
    .hero { padding: 40px 0 28px; }
    .hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.08; margin: 0 0 14px; letter-spacing: -.02em; text-wrap: balance; }
    .hero p { font-size: clamp(16px, 2.4vw, 19px); line-height: 1.55; color: var(--muted); margin: 0; max-width: 640px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 12px 0 48px; }
    .card {
      display: flex; flex-direction: column; gap: 10px;
      padding: 20px; border-radius: 16px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); text-decoration: none;
      box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card h2 { font-size: 19px; line-height: 1.3; margin: 0; text-wrap: balance; }
    .card p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
    .bar { display: flex; gap: 3px; height: 6px; }
    .bar span { flex: 1; border-radius: 3px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
    .tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
    .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .meta b { color: var(--accent); font-weight: 650; }
    footer.site { border-top: 1px solid var(--border); padding: 20px 0 max(24px, env(safe-area-inset-bottom)); font-size: 13.5px; color: var(--muted); }
    noscript { display: block; padding: 16px; border: 1px solid var(--border); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="./"><img src="favicon.svg" alt="">How It Works</a>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
    </header>

    <section class="hero">
      <h1>See how things actually work, one step at a time.</h1>
      <p>Animated walkthroughs of the protocols and systems behind everyday tech. Step through at your own pace, or press auto-play and watch the whole flow.</p>
    </section>

    <main class="grid" id="grid">
      <noscript>These explainers need JavaScript to animate.</noscript>
    </main>

    <footer class="site">
      Keyboard: <b>←</b> / <b>→</b> to step, <b>Space</b> to auto-play. On phones, swipe the diagram.
    </footer>
  </div>

  <script src="explainers/registry.js"></script>
  <script>
    (function () {
      var grid = document.getElementById('grid');
      (window.HIW_EXPLAINERS || []).forEach(function (x) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = 'explainers/' + x.slug + '/';
        var bar = document.createElement('div');
        bar.className = 'bar';
        (x.colors || ['#2563eb']).forEach(function (c) {
          var s = document.createElement('span'); s.style.background = c; bar.appendChild(s);
        });
        var h2 = document.createElement('h2'); h2.textContent = x.title;
        var p = document.createElement('p'); p.textContent = x.description;
        var meta = document.createElement('div'); meta.className = 'meta';
        meta.innerHTML = '<span></span><b>Start →</b>';
        meta.firstChild.textContent = (x.steps ? x.steps + ' steps · ' : '');
        var tags = document.createElement('div'); tags.className = 'tags';
        (x.tags || []).forEach(function (t) {
          var s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s);
        });
        a.append(bar, h2, p, meta, tags);
        grid.appendChild(a);
      });
    })();
  </script>
</body>
</html>
